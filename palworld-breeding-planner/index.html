<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帕鲁四词条配种方案生成器</title>
<style>
  :root {
    --bg: #10151b;
    --card: #1a222b;
    --card2: #222c37;
    --line: #2f3c4a;
    --text: #e8e4da;
    --dim: #9aa7b4;
    --accent: #f2a541;
    --accent2: #ffd479;
    --danger: #ff7b7b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.6;
    font-size: 15px;
  }
  header { padding: 28px 16px 6px; text-align: center; }
  header h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: 1px; }
  header .sub { color: var(--dim); font-size: 13px; margin: 0; }
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 14px 16px 36px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; color: var(--accent2); font-weight: 600; }
  .hint { color: var(--dim); font-size: 13px; margin: 8px 0 0; }
  input[type="text"], input:not([type]) {
    background: #121920;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    width: 100%;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input.invalid { border-color: var(--danger); }
  #target { max-width: 440px; }
  #passives {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
  }
  .passive-sel.neg { color: var(--danger); border-color: var(--danger); }
  .pas-dd { position: relative; }
  .pas-panel {
    position: absolute;
    z-index: 30;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 260px;
    overflow-y: auto;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .pas-opt {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 7px 10px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }
  .pas-opt:last-child { border-bottom: none; }
  .pas-opt:hover { background: rgba(242, 165, 65, 0.12); }
  .pas-opt[hidden] { display: none; }
  .pas-name { font-size: 14px; }
  .pas-desc { font-size: 12px; color: var(--dim); }
  .pas-opt.neg .pas-name { color: var(--danger); }
  .carrier-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 10px 0;
    border-top: 1px dashed var(--line);
  }
  .carrier-row:first-child { border-top: none; padding-top: 0; }
  .carrier-pal { flex: 1 1 220px; min-width: 180px; }
  .carrier-bits { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .bit {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    cursor: pointer;
    color: var(--dim);
    white-space: nowrap;
  }
  .bit input { accent-color: var(--accent); margin: 0; }
  .bit[hidden] { display: none; }
  button {
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    padding: 8px 14px;
    font-size: 14px;
  }
  button:hover { border-color: var(--accent); }
  #add-carrier { margin-top: 12px; }
  .del { color: var(--danger); padding: 6px 10px; }
  #generate {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1206;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 28px;
  }
  .err { color: var(--danger); font-size: 14px; margin: 10px 0 0; }
  .err:empty { display: none; }
  .notice { color: var(--accent2); font-size: 13px; margin: 10px 0 0; }
  .res-title { font-size: 16px; margin: 18px 0 4px; color: var(--accent2); font-weight: 600; }
  .sug-card, .plan-card {
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 10px 0;
  }
  .sug-card h4, .plan-card h4 { margin: 0 0 6px; font-size: 14.5px; }
  .sug-card p { margin: 4px 0; font-size: 14px; }
  .plan-meta { color: var(--dim); font-size: 13px; margin: 0; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; }
  .steps li {
    padding: 6px 10px;
    border-left: 3px solid var(--accent);
    margin: 6px 0;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 0 6px 6px 0;
  }
  .warn-line { color: var(--accent2); margin: 4px 0; font-size: 14px; }
  footer {
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    padding: 20px 16px 34px;
  }
</style>
</head>
<body>
<header>
  <h1>帕鲁四词条配种方案生成器</h1>
  <p class="sub">选定目标帕鲁与目标词条，录入你的携带者，自动生成分步孵化方案</p>
</header>
<main>
  <section class="card" id="sec-target">
    <h2>1. 目标帕鲁</h2>
    <input id="target" type="text" list="pal-list" placeholder="输入图鉴号或中文名搜索，如「139 阿努比斯」" autocomplete="off">
    <p class="hint">全部 299 种帕鲁均可作为目标。</p>
  </section>

  <section class="card" id="sec-passives-card">
    <h2>2. 目标词条（1~4 个）</h2>
    <div id="passives">
      <input class="passive-sel" type="text" placeholder="词条 1" autocomplete="off">
      <input class="passive-sel" type="text" placeholder="词条 2" autocomplete="off">
      <input class="passive-sel" type="text" placeholder="词条 3" autocomplete="off">
      <input class="passive-sel" type="text" placeholder="词条 4" autocomplete="off">
    </div>
    <p class="hint">按词条等级从高到低排列；选项下方显示具体加成，红色为负面词条（一般不要选）。</p>
  </section>

  <section class="card" id="sec-carriers-card">
    <h2>3. 我的携带者</h2>
    <div id="carriers"></div>
    <button id="add-carrier" type="button">+ 添加携带者</button>
    <p class="hint">每只携带者勾选它身上带有的目标词条；未填的词条槽位会隐藏对应复选框。</p>
  </section>

  <section class="card" id="sec-generate">
    <h2>4. 生成方案</h2>
    <button id="generate" type="button">生成方案</button>
    <p class="err" id="form-err"></p>
    <div id="results"></div>
  </section>
</main>

<footer>数据：Palworld 1.0 拆包（palcalc v27）；蛋数为偏乐观估算值（未计杂词条/变异占位）</footer>

<datalist id="pal-list"></datalist>

/* 配种引擎 (Task 2) — 依赖同目录 data.js (Task 1)。

(function (g) {
  const DATA = typeof module !== 'undefined' ? require('./data.js') : g.DATA;

  /* ---------- 通用公式 ----------
   * t = ⌊(rankA + rankB + 1) / 2⌋; 在 PALS 排除 GENERIC_EXCLUDED 后,
   * 按 (|rank - t|, -pri, isVariant?1:0) 升序取首 (距离并列 → pri 高者胜 → 非变体优先)。
   * 比较键依赖 t 无法全局预排, 故候选集只预排序一次 (rank 升 / pri 降 / 变体后),
   * 每次调用做线性取最小, 不做 per-call 全排 (183 候选; 实测 rank 全唯一, 无同 rank 并列)。 */
  const EXCLUDED = new Set(DATA.GENERIC_EXCLUDED);
  const CANDIDATES = DATA.PALS
    .filter((p) => !EXCLUDED.has(p.id))
    .sort(
      (x, y) =>
        x.rank - y.rank ||
        y.pri - x.pri ||
        (x.isVariant ? 1 : 0) - (y.isVariant ? 1 : 0)
    );

  function genericChild(aId, bId) {
    const ra = DATA.PAL_BY_ID[aId].rank;
    const rb = DATA.PAL_BY_ID[bId].rank;
    const t = Math.floor((ra + rb + 1) / 2);

    let bestDist = Infinity;
    let bestPri = -Infinity;
    let bestVar = 1;
    for (const p of CANDIDATES) {
      const d = Math.abs(p.rank - t);
      const v = p.isVariant ? 1 : 0;
      if (
        d < bestDist ||
        (d === bestDist &&
          (p.pri > bestPri || (p.pri === bestPri && v < bestVar)))
      ) {
        best = p;
        bestDist = d;
        bestPri = p.pri;
        bestVar = v;
      }

  }

   * 索引 key: 无序对 "x|y" (两个 id 按 JS 默认字符串比较升序 join)。
   * 每个 key 至多 2 行 —— 仅 CatMage|FoxMage 有两条性别行, 其余均为单条 WILDCARD 行。
   * 性别规则: 行的 ga/gb 为 WILDCARD 时匹配任意性别实参; 非 WILDCARD 时要求对应亲代实参精确相等。
   * 推论 (控制器裁定): 调用方未给性别 (实参 WILDCARD) 时不会命中任何性别行,
   * 如 childOf('CatMage','FoxMage') 直接落入通用公式; CHILD_OF_PAIR 对该对的取值即公式结果。 */
  const UNIQUE_BY_PAIR = new Map();
  for (const row of DATA.UNIQUE_COMBOS) {
    const key = [row.a, row.b].sort().join('|');
    if (!UNIQUE_BY_PAIR.has(key)) UNIQUE_BY_PAIR.set(key, []);
    UNIQUE_BY_PAIR.get(key).push(row);
  }

  function genderMatch(rowG, argG) {
    return rowG === WILDCARD || rowG === argG;
  }

  function matchUnique(rows, aId, bId, genderA, genderB) {
    for (const r of rows) {
      // 同向: 行 (a,ga)×(b,gb) 对 实参 (aId,genderA)×(bId,genderB)
      if (
        r.a === aId &&
        r.b === bId &&
        genderMatch(r.ga, genderA) &&
        genderMatch(r.gb, genderB)
      ) {
        return r.child;
      }
      // 反向: 父母无序, 行的 a/b 与实参交叉对应 (性别随亲代一起走)
      if (
        r.a === bId &&
        r.b === aId &&
        genderMatch(r.ga, genderB) &&
        genderMatch(r.gb, genderA)
      ) {
        return r.child;
      }
    }
    return null;
  }

  function childOf(aId, bId, genderA = WILDCARD, genderB = WILDCARD) {
    if (aId === bId) return aId; // 同种自交 → 同种
    const rows = UNIQUE_BY_PAIR.get([aId, bId].sort().join('|'));
    if (rows) {
      const hit = matchUnique(rows, aId, bId, genderA, genderB);
      if (hit) return hit;
    }
    return genericChild(aId, bId);
  }

  /* ---------- CHILD_OF_PAIR: 全部无序不同种对的预算表 (性别取 WILDCARD), 求解器 O(1) 查表 ----------
   * key 约定: 两个 id 按 JS 默认字符串比较 (UTF-16 码元) 升序排序后以 "|" 连接;
   * 升序/降序本可任选, 此处固定升序, 只要确定性即可。共 C(299,2) = 44,551 键。 */
  const CHILD_OF_PAIR = Object.create(null);
  const ids = DATA.PALS.map((p) => p.id);
  for (let i = 0; i < ids.length; i++) {
    for (let j = i + 1; j < ids.length; j++) {
      const key = [ids[i], ids[j]].sort().join('|');
      CHILD_OF_PAIR[key] = childOf(ids[i], ids[j]);
    }
  }

  /* ---------- fillable: 突袭限定 (raid-only) 黑名单不可填充 ---------- */
  const NOT_FILLABLE = new Set([
    'NightLady',
    'NightLady_Dark',
    'DarkAlien',
    'WhiteAlienDragon',
    'DarkMechaDragon',
    'KingBahamut_Dragon',
  ]);
  function fillable(id) {
    return !NOT_FILLABLE.has(id);
  }

  const ENGINE = { childOf, genericChild, fillable, CHILD_OF_PAIR };
  if (typeof module !== 'undefined') module.exports = ENGINE;
  else g.ENGINE = ENGINE;
})(globalThis);

<script>
/* src/solver.js */
/* 方案求解器 (Task 3) — 依赖同目录 data.js (Task 1) 与 engine.js (Task 2)。
 * UMD: node 端 module.exports / require; 浏览器端挂全局 SOLVER / 读全局 DATA、ENGINE。
 *
 * 核心模型
 *   状态 = (物种 palId, 目标词条位掩码 mask), 附带聚合值 {steps, fillers, eggs}
 *   与回溯指针 {parentA, parentB, eggsStep}。聚合值恒等于以该状态为根、
 *   重复子树重复计数的配种树之和, 因此回溯时直接展开父指针即可, 无需去重。
 *
 * 分层扩展 (BFS over 配种步数)
 *   bucket[i] 存放 steps===i 的状态; 第 T 层组合 bucket[i] × bucket[T-1-i]
 *   (i ≤ T-1-i), 子代 steps = a.steps+b.steps+1 = T。初始池为第 0 层:
 *   携带者 (source "carrier", fillers 0) + 每个 fillable 物种一只野生填充
 *   (mask 0, source "wild", fillers 1) + 缺词条时的虚拟携带者 __unknown__。
 *
 * 「万能携带者」假设 (controller ruling 1)
 *   当没有任何已登记携带者覆盖第 i 个目标词条时, 引入唯一的虚拟状态
 *   __unknown__ (mask = 全部缺失位, steps/fillers/eggs = 0, source "wild"),
 *   它代表「待补的野生携带者」: 与任意状态 X 配种时, 子代物种 = X 的物种
 *   (相当于词条直接嫁接过去), 子代 mask = OR, 正常消耗一步与蛋数。
 *   这是一个简化假设 — 现实中玩家需要去抓一只带该词条的对应物种;
 *   UI 需将其展示为「待补携带者」。__unknown__ 只有一份, 不可自交。
 *
 * 蛋数估算 (ruling 9, 偏乐观: 只算目标词条, 假定无杂词条干扰)
 *   每步 n = popcount(maskA|maskB) (= 子代需带的目标词条数 s),
 *   P = Σ_{k=s}^{4} (w_k/Σw) · C(n-s, k-s)/C(n, k), w = DATA.WEIGHTS.inherit,
 *   C 为 Pascal 组合数表; s=0 → 该步 eggs=1; 否则 eggs_step = 1/P。
 *   子代聚合: steps=a.steps+b.steps+1, fillers=a.fillers+b.fillers,
 *   eggs=a.eggs+b.eggs+eggs_step。保留浮点。
 *
 * 去重与剪枝
 *   dedup (ruling 6): 键 (palId, mask); 若现存态 steps/fillers/eggs 三项全 ≤
 *     新态则拒绝; 否则替换 (旧对象保留在已有子代的父指针里, 聚合值仍一致)。
 *   pareto (ruling 7): 每层结束后 (含第 0 层) 按物种分组, 若同种 X 的 mask
 *     是 Y 的真超集且三项聚合全不劣 → 剪掉 Y (不再参与后续组合)。
 *
 * 目标与终止 (rulings 2/4/5)
 *   早判无解: 目标种不可填充、且不作为任何配对子代出现、且无该种携带者。
 *   每生成一个 (targetId, fullMask) 子代即收集为候选 (含被 dedup 拒绝的,
 *   因为聚合值不同的等价键仍是合法备选方案), 上限 256。
 *   首个候选所在层为 G, 继续跑到 G+1 层后停; maxSteps=6 封顶;
 *   某层新增状态数为 0 也提前停。携带者若已含 (target, fullMask),
 *   0 步方案全维度严格最优, 直接返回, 不再跑层搜索列备选。
 *   最终按 (totalSteps, fillers, totalEggs) 升序取前 3。
 */
(function (g) {
  const DATA = typeof module !== 'undefined' ? require('./data.js') : g.DATA;
  const ENGINE = typeof module !== 'undefined' ? require('./engine.js') : g.ENGINE;

  const UNKNOWN_ID = '__unknown__';

  /* ---------- 物种索引 (DATA.PALS 顺序); __unknown__ 独占第 N 槽 ---------- */
  const N = DATA.PALS.length;
  const SP_IDX = new Map();
  for (let i = 0; i < N; i++) SP_IDX.set(DATA.PALS[i].id, i);
  const UNKNOWN_SP = N;

  /* ---------- 一次性预计算 (懒加载, 模块级缓存) ---------- */
  let _pairTable = null;   // Int16Array N*N: spA*N+spB → 子种索引; 对角 = 自身
  let _childValues = null; // CHILD_OF_PAIR 全部值的 Set (早判无解用)

  function buildOnce() {
    if (_pairTable) return;
    const t = new Int16Array(N * N).fill(-1);
    const vals = new Set();
    for (const key in ENGINE.CHILD_OF_PAIR) {
      const sep = key.indexOf('|');
      const ia = SP_IDX.get(key.slice(0, sep));
      const ib = SP_IDX.get(key.slice(sep + 1));
      const ic = SP_IDX.get(ENGINE.CHILD_OF_PAIR[key]);
      if (ia === undefined || ib === undefined || ic === undefined) continue;
      t[ia * N + ib] = ic;
      t[ib * N + ia] = ic;
      vals.add(ENGINE.CHILD_OF_PAIR[key]);
    }
    for (let i = 0; i < N; i++) t[i * N + i] = i; // 同种自交 → 自身
    _pairTable = t;
    _childValues = vals;
  }

  /* ---------- 蛋数估算: Pascal 表 + 每 n 预计算 (n,k ≤ 4) ---------- */
  const C = [];
  for (let n = 0; n <= 4; n++) {
    C[n] = new Array(5).fill(0);
    C[n][0] = 1;
    for (let k = 1; k <= n; k++) C[n][k] = C[n - 1][k - 1] + C[n - 1][k];
  }
  const W = DATA.WEIGHTS.inherit; // {'1':4,'2':3,'3':2,'4':1}
  const W_SUM = W['1'] + W['2'] + W['3'] + W['4'];
  // s 恒等于 n (子代需带齐并集里的全部目标词条), 故可对 n=0..4 一次性算出
  const EGG_STEP = [1, 0, 0, 0, 0];
  for (let n = 1; n <= 4; n++) {
    const s = n;
    let P = 0;
    for (let k = s; k <= 4; k++) {
      const num = C[n - s][k - s];
      if (num === 0) continue; // 该 k 项概率为 0 (避免 0/0 → NaN)
      P += (W[String(k)] / W_SUM) * (num / C[n][k]);
    }
    EGG_STEP[n] = 1 / P;
  }
  const POP = [0, 1, 1, 2, 1, 2, 2, 3, 1, 2, 2, 3, 2, 3, 3, 4]; // 4bit popcount

  /* ---------- 状态 ----------
   * {sp, mask, steps, fillers, eggs, source, parentA, parentB, eggsStep, dead}
   * source ∈ "carrier" | "wild" | "bred"; dead = 被替换或剪掉, 不再参与组合。 */

  function palIdOf(sp) {
    return sp === UNKNOWN_SP ? UNKNOWN_ID : DATA.PALS[sp].id;
  }

  /**
   * planSearch(targetId, passiveIds, carriers, maxSteps=6)
   *   passiveIds: 去重后的 1~4 个词条 id; bit i ↔ passiveIds[i]
   *   carriers: [{palId, mask}]
   *   → {plans: [{steps, totalSteps, fillers, totalEggs}] (≤3), missing: [i]}
   */
  function planSearch(targetId, passiveIds, carriers, maxSteps) {
    buildOnce();
    if (maxSteps === undefined) maxSteps = 6;
    const nBits = passiveIds.length;
    const fullMask = (1 << nBits) - 1;

    /* ---- missing: 所有携带者都不含 bit i → 计入其下标 ---- */
    const missing = [];
    for (let i = 0; i < nBits; i++) {
      const bit = 1 << i;
      if (!carriers.some((c) => (c.mask & bit) !== 0)) missing.push(i);
    }
    let missingMask = 0;
    for (const i of missing) missingMask |= 1 << i;

    /* ---- 早判无解 (ruling 2): 目标种不可填充 + 非任何配对子代 + 无该种携带者 ---- */
    const hasTargetCarrier = carriers.some((c) => c.palId === targetId);
    const reachable =
      ENGINE.fillable(targetId) || _childValues.has(targetId) || hasTargetCarrier;
    if (!reachable) return { plans: [], missing };

    const targetSp = SP_IDX.get(targetId);
    if (targetSp === undefined) return { plans: [], missing };

    /* ---- 已齐: 携带者已有 (target, fullMask) → 0 步方案全维度最优, 不列备选 ---- */
    if (
      carriers.some(
        (c) => c.palId === targetId && (c.mask & fullMask) === fullMask
      )
    ) {
      return {
        plans: [{ steps: [], totalSteps: 0, fillers: 0, totalEggs: 0 }],
        missing,
      };
    }

    /* ---- 初始池 = 第 0 层 ---- */
    const map = new Array((N + 1) * 16).fill(null); // key = sp*16+mask → 当前态
    const buckets = [];
    for (let i = 0; i <= maxSteps; i++) buckets.push([]);

    function addState(st) {
      const key = st.sp * 16 + st.mask;
      const cur = map[key];
      if (cur) {
        // 现存态三项全不劣 → 拒绝新态 (ruling 6)
        if (cur.steps <= st.steps && cur.fillers <= st.fillers && cur.eggs <= st.eggs) {
          return false;
        }
        cur.dead = true; // 替换: 旧对象仅保留在已建子代的父指针里
      }
      map[key] = st;
      if (st.steps <= maxSteps) buckets[st.steps].push(st);
      return true;
    }

    function leaf(sp, mask, fillers, source) {
      return {
        sp, mask, steps: 0, fillers, eggs: 0,
        source, parentA: null, parentB: null, eggsStep: 0, dead: false,
      };
    }

    for (const c of carriers) {
      const sp = SP_IDX.get(c.palId);
      if (sp === undefined) continue; // 未知物种无法参与查表, 忽略
      addState(leaf(sp, c.mask & fullMask, 0, 'carrier'));
    }
    for (let i = 0; i < N; i++) {
      if (ENGINE.fillable(DATA.PALS[i].id)) addState(leaf(i, 0, 1, 'wild'));
    }
    if (missingMask !== 0) addState(leaf(UNKNOWN_SP, missingMask, 0, 'wild'));

    /* ---- 帕累托剪枝 (ruling 7): 同种真超集且三项全不劣 → 剪掉 ---- */
    function prune() {
      for (let sp = 0; sp <= N; sp++) {
        const base = sp * 16;
        let live = null;
        for (let m = 0; m <= fullMask; m++) {
          const st = map[base + m];
          if (st && !st.dead) (live || (live = [])).push(st);
        }
        if (!live || live.length < 2) continue;
        for (const y of live) {
          for (const x of live) {
            if (
              x !== y &&
              (x.mask & y.mask) === y.mask &&
              x.mask !== y.mask &&
              x.steps <= y.steps &&
              x.fillers <= y.fillers &&
              x.eggs <= y.eggs
            ) {
              y.dead = true;
              break;
            }
          }
        }
      }
    }

    /* ---- 候选方案 ---- */
    const candidates = []; // 目标状态对象
    let G = null; // 首个候选所在层

    /* ---- 第 T 层: 组合 bucket[i] × bucket[T-1-i] (i ≤ T-1-i) ---- */
    function combineBuckets(i, j, T) {
      let added = 0;
      const A = buckets[i];
      const B = buckets[j];
      const same = i === j;
      for (let ai = 0; ai < A.length; ai++) {
        const a = A[ai];
        if (a.dead) continue;
        const bStart = same ? ai : 0;
        for (let bi = bStart; bi < B.length; bi++) {
          const b = B[bi];
          if (b.dead) continue;
          if (a === b && a.sp === UNKNOWN_SP) continue; // __unknown__ 不可自交
          let csp;
          if (a.sp === UNKNOWN_SP) csp = b.sp; // 万能携带者: 子种 = 对方物种
          else if (b.sp === UNKNOWN_SP) csp = a.sp;
          else {
            csp = _pairTable[a.sp * N + b.sp];
            if (csp < 0) continue;
          }
          const cmask = a.mask | b.mask;
          const st = {
            sp: csp,
            mask: cmask,
            steps: T, // = a.steps + b.steps + 1
            fillers: a.fillers + b.fillers,
            eggs: a.eggs + b.eggs + EGG_STEP[POP[cmask]],
            source: 'bred',
            parentA: a,
            parentB: b,
            eggsStep: EGG_STEP[POP[cmask]],
            dead: false,
          };
          if (addState(st)) added++;
          // 目标子代即收集 (含被 dedup 拒绝者: 等价键但聚合值不同, 仍是合法方案)
          if (
            csp === targetSp &&
            cmask === fullMask &&
            candidates.length < 256
          ) {
            candidates.push(st);
            if (G === null) G = T;
          }
        }
      }
      return added;
    }

    prune(); // 第 0 层后也要剪 (ruling 7)
    for (let T = 1; T <= maxSteps; T++) {
      if (G !== null && T > G + 1) break; // 已收候选: 跑到 G+1 层为止
      let added = 0;
      for (let i = 0; i <= T - 1 - i; i++) added += combineBuckets(i, T - 1 - i, T);
      prune();
      if (added === 0) break; // 该层无新状态 → 提前停
    }

    /* ---- 回溯 (ruling 10): DFS 后序展开父指针, 重复子树重复展开 ---- */
    function stepOf(s) {
      return { palId: palIdOf(s.sp), mask: s.mask, source: s.source };
    }

    function reconstruct(root) {
      const steps = [];
      (function dfs(s) {
        if (!s.parentA) return; // carrier / wild / __unknown__ 叶子
        // 步内双亲排序: palId 升序, 再 mask 升序 (确定性)
        let p1 = s.parentA;
        let p2 = s.parentB;
        const id1 = palIdOf(p1.sp);
        const id2 = palIdOf(p2.sp);
        if (id1 > id2 || (id1 === id2 && p1.mask > p2.mask)) {
          const tmp = p1;
          p1 = p2;
          p2 = tmp;
        }
        dfs(p1);
        dfs(p2);
        steps.push({
          parentA: stepOf(p1),
          parentB: stepOf(p2),
          child: { palId: palIdOf(s.sp), mask: s.mask },
          eggs: s.eggsStep,
        });
      })(root);
      return steps;
    }

    const plans = candidates.map((c) => ({
      steps: reconstruct(c),
      totalSteps: c.steps,
      fillers: c.fillers,
      totalEggs: c.eggs,
    }));
    plans.sort(
      (x, y) =>
        x.totalSteps - y.totalSteps || x.fillers - y.fillers || x.totalEggs - y.totalEggs
    );
    return { plans: plans.slice(0, 3), missing };
  }

  const SOLVER = { planSearch };
  if (typeof module !== 'undefined') module.exports = SOLVER;
  else g.SOLVER = SOLVER;
})(globalThis);
</script>
<script>
/* src/suggest.js */
(function(g){
const DATA=(typeof module!=='undefined')?require('./data.js'):g.DATA;

function dexKey(dex){
  const s=String(dex==null?'':dex);
  const n=parseInt(s,10);
  if(isNaN(n))return 99999;
  return /[A-Za-z]$/.test(s)?n+0.5:n;
}

function suggestForPassive(passiveId){
  const passive=DATA.PASSIVE_BY_ID[passiveId]||null;
  const ids=DATA.GUARANTEED[passiveId]||[];
  const guaranteed=ids.map(function(palId){
    const p=DATA.PAL_BY_ID[palId];
    if(!p)return null;
    return {palId:palId,zh:p.zh,dex:p.dex,minLv:p.minLv,maxLv:p.maxLv};
  }).filter(Boolean).sort(function(a,b){return dexKey(a.dex)-dexKey(b.dex);});
  return {passive:passive,guaranteed:guaranteed,randomAllowed:passive?!!passive.randomAllowed:false};
}

function suggestForMissing(passiveIds,missingIdx){
  return missingIdx.map(function(i){return suggestForPassive(passiveIds[i]);});
}

const SUGGEST={suggestForPassive:suggestForPassive,suggestForMissing:suggestForMissing};
if(typeof module!=='undefined')module.exports=SUGGEST; else g.SUGGEST=SUGGEST;
})(globalThis);
</script>
<script>
/* src/ui.js */
/* 页面 UI (Task 5) — 依赖全局 DATA / ENGINE / SOLVER / SUGGEST。
 * 挂载全局 UI; DOMContentLoaded 时 UI.init()。
 * localStorage: 'palPlanner.v1' → {target, passiveIds, carriers:[{palId, mask}]}
 * (mask 的第 i 位 ↔ passiveIds[i]) */

  const DATA = g.DATA;
  const ENGINE = g.ENGINE;
  const SOLVER = g.SOLVER;
  const SUGGEST = g.SUGGEST;

  for (const p of PALS) PAL_BY_DISPLAY.set(palDisplay(p), p.id);

  for (const p of PASSIVES) PASSIVE_BY_DISPLAY.set(passiveDisplay(p), p.id);

  /* ---------- DOM ---------- */

  const passiveInputs = []; // #passives 内 4 个 .passive-sel

  function $(sel) {

  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------- 当前表单状态 ---------- */
  // 4 个槽位: 已选词条 id 或 null (无法识别的非空输入也算 null, 生成时再报错)
  function currentSlots() {
    return passiveInputs.map((inp) => {
      const id = PASSIVE_BY_DISPLAY.get(inp.value.trim());
      return id || null;
    });
  }
  function currentPassiveIds() {
    return currentSlots().filter(Boolean);
  }

  /* ---------- 携带者行 ---------- */
  function refreshRowBits(row) {
    const slots = currentSlots();
    row.boxes.forEach((b, i) => {
      const pid = slots[i];
      if (pid) {
        b.wrap.hidden = false; // 未选词条的槽位: 隐藏对应复选框
        b.txt.textContent = DATA.PASSIVE_BY_ID[pid].zh;
        b.box.checked = row.checked.has(pid);
      } else {
        b.wrap.hidden = true;
        b.box.checked = false;
      }
    });
  }

  function syncRowChecked(row) {
    const slots = currentSlots();
    row.checked.clear();
    row.boxes.forEach((b, i) => {
      if (slots[i] && b.box.checked) row.checked.add(slots[i]);
    });
  }

  // 目标词条变化: 刷新所有行标签, 清掉已不在目标集里的勾选
  function refreshAllRows() {
    const valid = new Set(currentPassiveIds());
    for (const row of rows) {
      for (const id of Array.from(row.checked)) {
        if (!valid.has(id)) row.checked.delete(id);
      }
      refreshRowBits(row);
    }
  }

  function addCarrierRow(palId, checkedIds) {
    const root = el('div', 'carrier-row');
    const palInput = el('input', 'carrier-pal');
    palInput.type = 'text';
    palInput.setAttribute('list', 'pal-list');
    palInput.placeholder = '帕鲁（图鉴号或中文名）';
    palInput.autocomplete = 'off';

    const bitsWrap = el('span', 'carrier-bits');
    const boxes = [];
    for (let i = 0; i < 4; i++) {
      const lab = el('label', 'bit');
      const box = document.createElement('input');
      box.type = 'checkbox';
      const txt = el('span');
      lab.appendChild(box);
      lab.appendChild(txt);
      lab.hidden = true;
      bitsWrap.appendChild(lab);
      boxes.push({ wrap: lab, box, txt });
    }

    const del = el('button', 'del', '删除');
    del.type = 'button';

    root.appendChild(palInput);
    root.appendChild(bitsWrap);
    root.appendChild(del);
    elCarriers.appendChild(root);

    const row = { root, palInput, boxes, checked: new Set(checkedIds || []) };
    if (palId && DATA.PAL_BY_ID[palId]) {
      palInput.value = palDisplay(DATA.PAL_BY_ID[palId]);
    }

    boxes.forEach((b) => {
      b.box.addEventListener('change', () => {
        syncRowChecked(row);
        save();
      });
    });
    palInput.addEventListener('input', save);
    del.addEventListener('click', () => {
      const idx = rows.indexOf(row);
      if (idx >= 0) rows.splice(idx, 1);
      root.remove();
      save();
    });

    rows.push(row);
    refreshRowBits(row);
    return row;
  }

  /* ---------- localStorage ---------- */
  function save() {
    try {
      const passiveIds = currentPassiveIds();
      const carriers = rows.map((row) => {
        let mask = 0;
        passiveIds.forEach((id, i) => {
          if (row.checked.has(id)) mask |= 1 << i;
        });
        return {
          palId: PAL_BY_DISPLAY.get(row.palInput.value.trim()) || '',
          mask,
        };
      });
      const target = PAL_BY_DISPLAY.get(elTarget.value.trim()) || '';
      localStorage.setItem(LS_KEY, JSON.stringify({ target, passiveIds, carriers }));
    } catch (e) {
      /* localStorage 不可用 (隐私模式等) 时静默跳过 */
    }
  }

  function restore() {
    let st = null;
    try {
      st = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    } catch (e) {
      st = null;
    }
    if (st && typeof st === 'object') {
      if (st.target && DATA.PAL_BY_ID[st.target]) {
        elTarget.value = palDisplay(DATA.PAL_BY_ID[st.target]);
      }
      const ids = Array.isArray(st.passiveIds) ? st.passiveIds : [];
      ids.slice(0, 4).forEach((id, i) => {
        const p = DATA.PASSIVE_BY_ID[id];
        if (p && passiveInputs[i]) passiveInputs[i].value = passiveDisplay(p);
      });
      const cs = Array.isArray(st.carriers) ? st.carriers : [];
      for (const c of cs) {
        if (!c || typeof c !== 'object') continue;
        const checked = [];
        ids.forEach((id, i) => {
          if ((c.mask & (1 << i)) !== 0) checked.push(id);
        });
        addCarrierRow(c.palId || '', checked);
      }
    }
    if (rows.length === 0) addCarrierRow('', []);
    refreshNegatives();
    refreshAllRows();
  }

  /* ---------- 负面词条标红 ---------- */
  function refreshNegatives() {
    for (const inp of passiveInputs) {
      const id = PASSIVE_BY_DISPLAY.get(inp.value.trim());
      const p = id ? DATA.PASSIVE_BY_ID[id] : null;
      inp.classList.toggle('neg', !!(p && p.negative));
    }
  }

  /* ---------- 渲染辅助 ---------- */
  function palZh(palId) {
    const p = DATA.PAL_BY_ID[palId];
    return p ? p.zh : String(palId);
  }

  function passiveZh(id) {
    const p = DATA.PASSIVE_BY_ID[id];
    return p ? p.zh : String(id);
  }

  function maskZh(mask, passiveIds) {
    const names = [];
    passiveIds.forEach((id, i) => {
      if ((mask & (1 << i)) !== 0) names.push(passiveZh(id));
    });
    return names.length ? names.join('+') : '—';
  }

  function parentText(parent, passiveIds) {
    if (parent.palId === UNKNOWN_ID) return '⚠ 待补携带者';
    const name = palZh(parent.palId);
    const m = '（' + maskZh(parent.mask, passiveIds) + '）';
    if (parent.source === 'carrier') return '你的 ' + name + m;
    if (parent.source === 'wild') return '任意 ' + name + m;
    return name + m; // bred: 由前序步骤配出
  }

  // 目标种是否出现在任何配对的子代里 (与 SOLVER 早判无解同条件, 懒建一次)
  let _childValues = null;
  function childValues() {
    if (!_childValues) {
      _childValues = new Set();
      for (const key in ENGINE.CHILD_OF_PAIR) {
        _childValues.add(ENGINE.CHILD_OF_PAIR[key]);
      }
    }
    return _childValues;
  }

  /* ---------- 生成 ---------- */
  function fail(msg) {
    elErr.textContent = msg;
    elResults.innerHTML = '';
  }

  function generate() {
    elErr.textContent = '';
    elResults.innerHTML = '';

    // 1. 目标必选且可识别
    const targetText = elTarget.value.trim();
    if (!targetText) return fail('请先选择目标帕鲁。');
    const targetId = PAL_BY_DISPLAY.get(targetText);
    if (!targetId) return fail('无法识别的目标帕鲁，请从下拉列表中选择。');

    // 2. 词条 1~4 个且不重复
    const slots = currentSlots();
    for (let i = 0; i < 4; i++) {
      if (!slots[i] && passiveInputs[i].value.trim()) {
        return fail('第 ' + (i + 1) + ' 个词条无法识别，请从下拉列表中选择。');
      }
    }
    const passiveIds = slots.filter(Boolean);
    if (passiveIds.length === 0) return fail('请选择 1~4 个目标词条。');
    for (let i = 0; i < passiveIds.length; i++) {
      if (passiveIds.indexOf(passiveIds[i]) !== i) {
        return fail('词条重复：' + passiveZh(passiveIds[i]) + '，请修改后再生成。');
      }
    }

    // 3. 携带者: 空行跳过, 同种同 mask 去重 (合并提示)
    const carriers = [];
    const seen = new Set();
    let merged = 0;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      const txt = row.palInput.value.trim();
      if (!txt) continue;
      const pid = PAL_BY_DISPLAY.get(txt);
      if (!pid) {
        return fail('第 ' + (r + 1) + ' 行携带者无法识别，请从下拉列表中选择。');
      }
      let mask = 0;
      passiveIds.forEach((id, i) => {
        if (row.checked.has(id)) mask |= 1 << i;
      });
      const key = pid + '#' + mask;
      if (seen.has(key)) {
        merged++;
        continue;
      }
      seen.add(key);
      carriers.push({ palId: pid, mask });
    }

    // 4. 求解 + 渲染
    const result = SOLVER.planSearch(targetId, passiveIds, carriers);
    render(targetId, passiveIds, carriers, result.plans, result.missing, merged);
  }

  function render(targetId, passiveIds, carriers, plans, missing, merged) {
    elResults.innerHTML = '';

    if (merged > 0) {
      elResults.appendChild(
        el('p', 'notice', '已自动合并 ' + merged + ' 只重复携带者（同种同词条）。')
      );
    }

    // 缺词条建议: 先渲染
    if (missing && missing.length > 0) {
      elResults.appendChild(el('h3', 'res-title', '缺少携带者的词条'));
      const sugs = SUGGEST.suggestForMissing(passiveIds, missing);
      missing.forEach((mi, k) => {
        const s = sugs[k] || { passive: null, guaranteed: [], randomAllowed: false };
        const zh = s.passive ? s.passive.zh : passiveZh(passiveIds[mi]); // passive 可能为 null, 防御
        const card = el('div', 'sug-card');
        card.appendChild(el('h4', null, '「' + zh + '」获取建议'));
        if (s.guaranteed && s.guaranteed.length > 0) {
          for (const gp of s.guaranteed) {
            const lv =
              gp.minLv && gp.maxLv
                ? '野生 Lv ' + gp.minLv + '–' + gp.maxLv
                : '特殊获取';
            card.appendChild(
              el('p', null, '去抓一只 ' + gp.zh + '（' + gp.dex + '，' + lv + '）必带')
            );
          }
        } else if (s.randomAllowed) {
          card.appendChild(
            el('p', null, '任何野生帕鲁都可能随机出，建议批量抓低等级帕鲁或配种碰变异')
          );
        } else {
          card.appendChild(
            el('p', null, '该词条只能来自变异蛋等特殊途径，需先获得任意携带者')
          );
        }
        elResults.appendChild(card);
      });
    }

    // 无解: 区分原因
    if (!plans || plans.length === 0) {
      const hasTargetCarrier = carriers.some((c) => c.palId === targetId);
      const reachable =
        ENGINE.fillable(targetId) || childValues().has(targetId) || hasTargetCarrier;
      const card = el('div', 'plan-card');
      if (reachable) {
        const tip =
          '无解：' + MAX_STEPS + ' 步配种内凑不齐所选词条 — 试试补充携带者或减少目标词条';
        // 只有真的渲染了建议卡 (有缺词条) 时才提「上方建议」
        card.appendChild(
          el('p', 'warn-line', missing && missing.length > 0 ? tip + '，或按上方建议抓取。' : tip + '。')
        );
      } else {
        card.appendChild(
          el(
            'p',
            'warn-line',
            '无解：「' + palZh(targetId) + '」只能由同种自交获得，而你还没有该种的携带者 — 请先获得一只「' +
              palZh(targetId) + '」并录入携带者列表。'
          )
        );
      }
      elResults.appendChild(card);
      return;
    }

    // 方案卡片
    const count = CN_NUM[Math.min(passiveIds.length, 4)];
    elResults.appendChild(
      el(
        'h3',
        'res-title',
        '「' + palZh(targetId) + '」' + count + '词条配种方案（共 ' + plans.length + ' 个）'
      )
    );
    plans.forEach((plan, i) => {
      const card = el('div', 'plan-card');
      card.appendChild(el('h4', null, '方案 ' + (i + 1)));
      if (!plan.steps || plan.steps.length === 0) {
        card.appendChild(el('p', null, '你已拥有目标帕鲁且四词条齐全，无需孵化'));
      } else {
        card.appendChild(
          el(
            'p',
            'plan-meta',
            '共 ' + plan.totalSteps + ' 步 · 需抓 ' + plan.fillers + ' 只野生填充 · 总预期约 ' +
              plan.totalEggs.toFixed(1) + ' 蛋'
          )
        );
        const ol = el('ol', 'steps');
        plan.steps.forEach((st, j) => {
          const li = el('li');
          li.textContent =
            j + 1 + '. ' +
            parentText(st.parentA, passiveIds) +
            ' × ' +
            parentText(st.parentB, passiveIds) +
            ' → ' +
            palZh(st.child.palId) +
            '（' + maskZh(st.child.mask, passiveIds) + '；约 ' + st.eggs.toFixed(1) + ' 蛋）';
          ol.appendChild(li);
        });
        card.appendChild(ol);
      }
      elResults.appendChild(card);
    });
  }

  /* ---------- 词条下拉 (自绘面板: 红色负面 + buff 描述) ---------- */
  // 结构: 每个 .passive-sel 输入框外包 .pas-dd, 内挂 .pas-panel(115 条 .pas-opt)。
  // 输入框仍是唯一状态载体 (值 = passiveDisplay 串), 现有 currentSlots/存档逻辑不变。
  function buildPassiveDropdowns() {
    for (const inp of passiveInputs) {
      const dd = el('div', 'pas-dd');
      inp.parentNode.insertBefore(dd, inp);
      dd.appendChild(inp);
      const panel = el('div', 'pas-panel');
      panel.hidden = true;
      const opts = [];
      for (const p of PASSIVES) {
        const opt = el('div', 'pas-opt' + (p.negative ? ' neg' : ''));
        opt.dataset.id = p.id;
        const name = el('span', 'pas-name', passiveDisplay(p));
        const desc = el('span', 'pas-desc', p.desc || '');
        opt.appendChild(name);
        opt.appendChild(desc);
        opt.addEventListener('mousedown', (e) => {
          e.preventDefault(); // 阻止 blur 先触发
          inp.value = passiveDisplay(p);
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          close();
        });
        panel.appendChild(opt);
        opts.push({ opt, p });
      }
      dd.appendChild(panel);

      function filter() {
        const q = inp.value.trim().replace(/（负面）/g, '').toLowerCase();
        let firstVisible = null;
        for (const { opt, p } of opts) {
          const hit =
            !q ||
            p.zh.toLowerCase().includes(q) ||
            (p.desc || '').toLowerCase().includes(q);
          opt.hidden = !hit;
          if (hit && !firstVisible) firstVisible = opt;
        }
        return firstVisible;
      }
      function open() {
        filter();
        panel.hidden = false;
      }
      function close() {
        panel.hidden = true;
      }
      let blurTimer = 0;
      inp.addEventListener('focus', () => {
        clearTimeout(blurTimer); // 重聚焦取消挂起的关闭, 防 blur→focus 竞态
        open();
      });
      inp.addEventListener('input', () => {
        if (panel.hidden) open();
        else filter();
      });
      inp.addEventListener('blur', () => {
        blurTimer = setTimeout(close, 120);
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !panel.hidden) {
          const first = filter();
          if (first) first.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          e.preventDefault();
        } else if (e.key === 'Escape') {
          close();
        }
      });
    }
  }

  /* ---------- init ---------- */
  function init() {
    elTarget = $('#target');
    elPassivesBox = $('#passives');
    elCarriers = $('#carriers');
    elAdd = $('#add-carrier');
    elGen = $('#generate');
    elResults = $('#results');
    elErr = $('#form-err');

    // 帕鲁 datalist (目标 + 携带者行共用)
    const palList = $('#pal-list');
    for (const p of PALS) {
      const opt = document.createElement('option');
      opt.value = palDisplay(p);
      palList.appendChild(opt);
    }

    const inputs = elPassivesBox.querySelectorAll('.passive-sel');
    for (const inp of inputs) passiveInputs.push(inp);
    buildPassiveDropdowns();

    elTarget.addEventListener('input', save);
    for (const inp of passiveInputs) {
      inp.addEventListener('input', () => {
        refreshNegatives();
        refreshAllRows();
        save();
      });
    }
    elAdd.addEventListener('click', () => {
      addCarrierRow('', []);
      save();
    });
    elGen.addEventListener('click', generate);

    restore();
  }

  const UI = { init };
  g.UI = UI;
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }
})(globalThis);
</script>
</body>
</html>
